## BeanNote — SWAG reverse proxy (Unraid)
##
## Kopiér denne fil til:
##   /mnt/user/appdata/swag/nginx/proxy-confs/beannote.subdomain.conf
##
## Forudsætninger
## 1. BeanNote-containeren hedder "beannote" (som i docker-compose / Unraid-templaten).
## 2. SWAG og BeanNote er på det samme Docker-netværk (fx et custom bridge: proxynet).
##    Unraid: BeanNote → Edit → Network Type → samme netværk som SWAG.
##    Fjern host-port 8501 fra WAN; SWAG er indgangen.
## 3. DNS: CNAME eller A-record for beannote.ditdomæne.dk → din Unraid/WAN-IP.
## 4. I BeanNote-templaten:
##      PUBLIC_BASE_URL=https://beannote.ditdomæne.dk
##    (ingen trailing slash). Genstart BeanNote efter ændringen.
## 5. Genstart SWAG efter du har lagt filen i proxy-confs.
##
## Login og PWA kræver HTTPS. client_max_body_size matcher BeanNotes 12 MB upload-loft.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name beannote.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 16M;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        set $upstream_app beannote;
        set $upstream_port 8501;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
