services:
  beannote:
    image: ghcr.io/${GITHUB_USERNAME:-stefan240987}/beannote:latest
    build: .
    container_name: beannote
    restart: unless-stopped
    ports:
      - "8502:8502"
    environment:
      ENVIRONMENT: production
      PUID: "99"
      PGID: "100"
      TZ: Europe/Copenhagen
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      RESET_DB_ON_START: "false"
      WEB_WORKERS: "1"
      JOB_WORKERS: "0"
      OCR_MAX_CONCURRENT: "2"
      SCAN_RATE_PER_MINUTE: "8"
      ENRICH_RATE_PER_MINUTE: "4"
      SUPPORT_MOBILEPAY_URL: ${SUPPORT_MOBILEPAY_URL:-}
      SUPPORT_BUYMEACOFFEE_URL: ${SUPPORT_BUYMEACOFFEE_URL:-}
    volumes:
      - /mnt/user/appdata/beannote/data:/app/data
    labels:
      net.unraid.docker.managed: dockerman
      net.unraid.docker.webui: "http://[IP]:[PORT:8502]"
      net.unraid.docker.icon: "https://raw.githubusercontent.com/stefan240987/beannote/main/.github/icon.png"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8502/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
