<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      var supported = ["da", "en"];
      var fallback = "en";
      function primary(lang) {
        return String(lang || "").toLowerCase().replace(/_/g, "-").split("-")[0];
      }
      try {
        if (localStorage.getItem("beannote_token")) {
          var stored = primary(localStorage.getItem("beannote_lang"));
          if (supported.indexOf(stored) !== -1) {
            document.documentElement.lang = stored;
            return;
          }
        }
      } catch (e) {}
      var locales = [];
      try { if (navigator.languages) locales = locales.concat(navigator.languages); } catch (e) {}
      try { if (navigator.language) locales.push(navigator.language); } catch (e) {}
      for (var i = 0; i < locales.length; i++) {
        var code = primary(locales[i]);
        if (supported.indexOf(code) !== -1) {
          document.documentElement.lang = code;
          return;
        }
      }
      document.documentElement.lang = fallback;
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2D1B14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>BeanNote</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            espresso: "#3c2a21",
            terracotta: "#b85c38",
            cream: "#faf6f0",
            foam: "#f3ebe3",
            latte: "#e8d8c8",
            muted: "#8c7a6b",
          },
          fontFamily: {
            display: ["Fraunces", "Georgia", "serif"],
            sans: ["Outfit", "Avenir Next", "system-ui", "sans-serif"],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="/static/css/styles.css?v=1.1.11">
  <style>
    .journal-bean-chevron {
      display: grid;
      place-items: center;
      width: 1.75rem;
      height: 1.75rem;
      flex-shrink: 0;
      border-radius: 999px;
      background: #f3ebe3;
      color: #8c7a6b;
      font-size: 0.8rem;
      line-height: 1;
      transition: transform 0.15s ease;
    }
    .journal-bean-chevron.is-open { transform: rotate(180deg); }
    .journal-feed-head { align-items: center; }
    .journal-open-btn {
      flex-shrink: 0;
      min-height: 2.25rem;
      padding: 0 0.7rem;
      border-radius: 999px;
      background: #f3ebe3;
      color: #b85c38;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .gear-match-badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 0.15rem 0.55rem;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    .gear-match-exact { background: #b85c38; color: #faf6f0; }
    .gear-match-machine { background: #3c2a21; color: #faf6f0; }
    .gear-match-grinder { background: #f4ebd9; color: #3c2a21; }
  </style>
</head>
<body class="min-h-dvh bg-cream font-sans text-espresso antialiased">
  <template id="tabbar-brand">
    <div class="tabbar-brand">
      <span class="tabbar-brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6.2 8.2h8.4c1.7 0 3 1.4 3 3.1s-1.3 3.1-3 3.1h-1.6v1.5c0 2-1.6 3.6-3.6 3.6s-3.6-1.6-3.6-3.6V8.2z" fill="#F7EFE6"/>
          <path d="M15.4 9.7h1.2c.9 0 1.5.7 1.5 1.5s-.6 1.5-1.5 1.5h-1.2" stroke="#2D1B14" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="10.1" cy="13.1" r="1.35" fill="#b85c38"/>
        </svg>
      </span>
      <span class="tabbar-brand-name" data-i18n="app_name">BeanNote</span>
    </div>
  </template>
  <template id="bottom-nav-tabs">
    <button type="button" id="explore-tab" data-tab="explore" data-icon="☕" data-i18n="tab_explore">Udforsk</button>
    <button type="button" id="favorites-tab" data-tab="favorites" data-icon="❤️" data-i18n="tab_favorites">Favoritter</button>
    <button type="button" id="scan-tab" data-tab="scan" data-icon="📸" data-i18n="tab_scan">Scan</button>
    <button type="button" id="diary-tab" data-tab="diary" data-icon="📖" data-i18n="tab_diary">Dagbog</button>
    <button type="button" id="profile-tab" data-tab="profile" data-icon="👤" data-i18n="tab_profile">Profil</button>
  </template>
  <template id="guest-nav-tabs">
    <button type="button" id="explore-tab" data-tab="explore" data-icon="☕" data-i18n="tab_explore">Udforsk</button>
    <button type="button" id="login-tab" data-tab="login" data-icon="🔑" data-i18n="login">Log ind</button>
  </template>
  <template id="gear-kind-tabs">
    <button type="button" class="gear-tab" data-gear-kind="espresso_machine" data-i18n="gear_machine">Espresso</button>
    <button type="button" class="gear-tab" data-gear-kind="grinder" data-i18n="gear_grinder">Kværn</button>
    <button type="button" class="gear-tab" data-gear-kind="brewer" data-i18n="gear_brewer">Brygger</button>
    <button type="button" class="gear-tab" data-gear-kind="scale_kettle" data-i18n="gear_scale_kettle">Vægt &amp; Kedel</button>
  </template>
  <template id="gear-admin-types">
    <option value="espresso_machine" data-i18n="gear_type_espresso_machine">Espresso-maskine</option>
    <option value="grinder" data-i18n="gear_type_grinder">Kværn</option>
    <option value="brewer" data-i18n="gear_type_brewer">Brygger</option>
    <option value="scale_kettle" data-i18n="gear_type_scale_kettle">Vægt &amp; Kedel</option>
  </template>
  <template id="sort-beans-select">
    <select id="sortBeansSelect" class="explore-sort" data-i18n-aria="sort_beans" aria-label="Sorter">
      <option value="rating_desc" data-i18n="sort_rating_desc">Bedste bedømmelse</option>
      <option value="ratings_count_desc" data-i18n="sort_ratings_count_desc">Flest bedømmelser</option>
      <option value="roaster_asc" data-i18n="sort_roaster_asc">Risteri (A-Å)</option>
      <option value="name_asc" data-i18n="sort_name_asc">Navn (A-Å)</option>
      <option value="newest" data-i18n="sort_newest">Nyeste</option>
    </select>
  </template>
  <template id="from-url-modal-tpl">
    <div id="from-url-modal" data-close-from-url class="fixed inset-0 z-50 flex items-end justify-center bg-espresso/50 px-4 sm:items-center">
      <article class="mb-20 w-full max-w-sm overflow-hidden rounded-3xl bg-cream shadow-2xl sm:mb-0" data-from-url-sheet>
        <form id="from-url-form" class="space-y-3 p-5">
          <h2 class="font-display text-xl font-bold" data-i18n="create_from_link">🔗 Opret fra Link</h2>
          <input id="from-url-input" type="url" inputmode="url" autocomplete="url" class="min-h-12 w-full rounded-xl border border-latte bg-white px-3 text-sm" data-i18n-placeholder="paste_product_link" placeholder="Indsæt produkt-link">
          <button type="submit" id="from-url-submit" class="flex min-h-12 w-full items-center justify-center gap-2 rounded-xl bg-terracotta font-semibold text-cream" data-i18n="analyze_with_gemini">✨ Analysér med Gemini</button>
          <button type="button" data-close-from-url class="min-h-11 w-full text-sm font-semibold text-muted" data-i18n="close_detail">Luk</button>
        </form>
      </article>
    </div>
  </template>
  <div id="app" class="app-root mx-auto flex min-h-dvh flex-col"></div>
  <input id="scan-input" type="file" accept="image/*" class="scan-file-input" tabindex="-1" aria-hidden="true">
  <input id="gear-admin-existing-photo" type="file" accept="image/*" class="sr-only" tabindex="-1" aria-hidden="true">
  <input id="bean-admin-photo" type="file" accept="image/*" class="sr-only" tabindex="-1" aria-hidden="true">
  <script src="/static/js/app.js?v=1.1.11"></script>
</body>
</html>
