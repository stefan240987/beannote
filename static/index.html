<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#3c2a21">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>BeanNote</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            espresso: "#3c2a21",
            terracotta: "#b85c38",
            cream: "#faf6f0",
            foam: "#f3ebe3",
            latte: "#e8d8c8",
            muted: "#8c7a6b",
          },
          fontFamily: {
            display: ["Fraunces", "Georgia", "serif"],
            sans: ["Outfit", "Avenir Next", "system-ui", "sans-serif"],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="/static/css/styles.css?v=6.6.2">
</head>
<body class="min-h-dvh bg-cream font-sans text-espresso antialiased">
  <template id="gear-kind-tabs">
    <button type="button" data-gear-kind="espresso_machine" data-i18n="gear_machine">Espressomaskine</button>
    <button type="button" data-gear-kind="grinder" data-i18n="gear_grinder">Kværn</button>
    <button type="button" data-gear-kind="brewer" data-i18n="gear_brewer">Brygger</button>
    <button type="button" data-gear-kind="scale_kettle" data-i18n="gear_scale_kettle">Vægt &amp; Kedel</button>
  </template>
  <div id="app" class="mx-auto flex min-h-dvh max-w-lg flex-col"></div>
  <script src="/static/js/app.js?v=6.6.2"></script>
</body>
</html>
